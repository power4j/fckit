spring:
  application:
    name: fist-web-data-security-example
  datasource:
    url: jdbc:h2:mem:fist_web_data_security_example;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
  sql:
    init:
      mode: always

fist:
  security:
    authentication:
      trusted:
        enabled: true
